<style>
/* ============================================================
   ПОЛИГЛОТ · стили
   ============================================================ */

:root {
  --bg:        #100E0C;
  --bg-2:      #1A1714;
  --card:      #211D19;
  --card-2:    #2A251F;
  --line:      #352F28;
  --ink:       #F2EDE6;
  --ink-dim:   #A79C8E;
  --ink-faint: #6E6458;
  --accent:    #E0A155;
  --accent-2:  #C4532F;
  --ok:        #6FAE6B;
  --bad:       #D2604F;
  --radius:    16px;
  --tap:       52px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

body { padding-bottom: env(safe-area-inset-bottom); }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input  { font: inherit; }

/* ---------- каркас ---------- */

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 16px 96px;
  min-height: 100vh;
}

.topbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.topbar .back {
  width: 40px; height: 40px; flex: 0 0 40px;
  display: grid; place-items: center;
  background: var(--card); border-radius: 12px;
  font-size: 20px; color: var(--ink-dim);
}
.topbar h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.topbar .sub { font-size: 13px; color: var(--ink-faint); margin-top: 1px; }
.topbar .spacer { flex: 1; }

.brand {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;
}
.brand h1 {
  font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.02em;
}
.brand span { font-size: 13px; color: var(--ink-faint); }

/* ---------- карточки ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* ---------- статистика сверху ---------- */

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 18px;
}
.stat {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 10px; text-align: center;
}
.stat .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.stat .k { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
.stat.hot .v { color: var(--accent); }

/* ---------- кнопки ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap);
  padding: 0 20px;
  border-radius: 14px;
  background: var(--card-2);
  border: 1px solid var(--line);
  font-weight: 600;
  transition: transform .08s ease, background .15s ease;
  width: 100%;
  text-align: center;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #1A1206; border-color: transparent; }
.btn.danger  { background: var(--accent-2); color: #fff; border-color: transparent; }
.btn.ghost   { background: transparent; }
.btn.sm      { min-height: 42px; font-size: 15px; padding: 0 14px; width: auto; }
.btn[disabled] { opacity: .4; }

.btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
.btn-row .btn { flex: 1; }

/* ---------- список уроков ---------- */

.lesson {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px;
  margin-bottom: 10px;
}
.lesson.locked { opacity: .42; }
.lesson .num {
  width: 42px; height: 42px; flex: 0 0 42px;
  display: grid; place-items: center;
  border-radius: 12px; background: var(--card-2);
  font-weight: 700; font-size: 16px;
}
.lesson.done .num { background: var(--ok); color: #0C1A0B; }
.lesson.current .num { background: var(--accent); color: #1A1206; }
.lesson .t { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.lesson .g { font-size: 13px; color: var(--ink-faint); margin-top: 2px; }
.lesson .chev { color: var(--ink-faint); font-size: 20px; }

/* ---------- вкладки ---------- */

.tabs {
  display: flex; gap: 6px; background: var(--bg-2);
  padding: 4px; border-radius: 14px; margin-bottom: 16px;
}
.tabs button {
  flex: 1; min-height: 40px; border-radius: 10px;
  font-size: 14px; font-weight: 600; color: var(--ink-dim);
}
.tabs button.on { background: var(--card-2); color: var(--ink); }

/* ---------- теория ---------- */

.theory { font-size: 16px; line-height: 1.62; }
.theory h3 {
  font-size: 15px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--accent); margin: 26px 0 10px;
}
.theory p { margin: 0 0 12px; }
.theory ul { margin: 0 0 14px; padding-left: 20px; }
.theory li { margin-bottom: 6px; }
.theory b { color: #fff; font-weight: 650; }
.theory .lead { font-size: 17px; }
.theory .dim { color: var(--ink-faint); font-size: 14px; }
.theory .note {
  background: var(--bg-2); border-left: 3px solid var(--accent);
  padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 15px;
}
.theory .mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14.5px; background: var(--bg-2);
  padding: 10px 12px; border-radius: 10px; line-height: 1.7;
}
.theory .bad { color: var(--bad); text-decoration: line-through; }
.theory blockquote {
  margin: 0 0 14px; padding: 12px 14px;
  background: var(--bg-2); border-radius: 12px; line-height: 1.8;
}

.table-wrap { overflow-x: auto; margin: 0 0 16px; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table th, table td {
  border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top;
}
table th { background: var(--bg-2); font-weight: 600; color: var(--ink-dim); font-size: 13px; }
table.petrov td { min-width: 96px; }
table.pairs td:first-child { font-weight: 600; white-space: nowrap; }
table.pairs td:last-child { color: var(--ink-dim); }

/* ---------- тренажёр ---------- */

.drill-top {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  font-size: 13px; color: var(--ink-faint);
}
.bar { flex: 1; height: 6px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

.prompt {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 18px;
  text-align: center; margin-bottom: 14px;
}
.prompt .hint {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--accent); margin-bottom: 10px;
}
.prompt .ru { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; }

.answer {
  min-height: 68px; border: 1.5px dashed var(--line); border-radius: 14px;
  padding: 10px; margin-bottom: 14px;
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
}
.answer.ok  { border-color: var(--ok);  border-style: solid; background: rgba(111,174,107,.09); }
.answer.bad { border-color: var(--bad); border-style: solid; background: rgba(210,96,79,.09); }

.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tile {
  min-height: 44px; padding: 0 14px;
  display: inline-flex; align-items: center;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 11px; font-size: 16px; font-weight: 500;
}
.tile:active { transform: scale(.95); }
.tile.used { opacity: .22; pointer-events: none; }

.feedback { margin-bottom: 14px; text-align: center; }
.feedback .correct { font-size: 20px; font-weight: 650; }
.feedback .label { font-size: 13px; color: var(--ink-faint); margin-bottom: 4px; }
.feedback.ok .correct  { color: var(--ok); }
.feedback.bad .correct { color: var(--bad); }

.typed {
  width: 100%; min-height: var(--tap);
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; color: var(--ink);
  margin-bottom: 12px;
}
.typed:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* ---------- карточки слов ---------- */

.flash {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 34px 20px;
  text-align: center; margin-bottom: 14px; min-height: 190px;
  display: flex; flex-direction: column; justify-content: center; gap: 12px;
}
.flash .word { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.flash .tr   { font-size: 20px; color: var(--accent); }
.flash .tap  { font-size: 13px; color: var(--ink-faint); }

.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade .btn { font-size: 14px; padding: 0 8px; }

/* ---------- прочее ---------- */

.speak {
  width: 44px; height: 44px; flex: 0 0 44px;
  display: grid; place-items: center;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 12px; font-size: 19px;
}

.empty { text-align: center; color: var(--ink-faint); padding: 40px 20px; }
.empty .big { font-size: 40px; margin-bottom: 10px; }

.profile-pick { display: grid; gap: 10px; margin-top: 30px; }
.profile-pick .btn { min-height: 64px; font-size: 18px; }

.wordlist { display: grid; gap: 6px; }
.wordlist .w {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; font-size: 15px;
}
.wordlist .w b { font-weight: 600; min-width: 42%; }
.wordlist .w span { color: var(--ink-dim); flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--card-2); border: 1px solid var(--line);
  padding: 12px 18px; border-radius: 14px; font-size: 15px;
  z-index: 50; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  animation: pop .25s ease;
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, 10px); } }

.footnote { font-size: 12.5px; color: var(--ink-faint); text-align: center; margin-top: 20px; line-height: 1.6; }

/* ============================================================
   Игровые механики
   ============================================================ */

/* --- талисман --- */

.mascot-wrap { flex: 0 0 auto; line-height: 0; }
.mascot { display: block; }
.mood-excited { animation: bob .6s ease-in-out infinite alternate; }
.mood-happy   { animation: bob 1.6s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

/* --- уровень / лига --- */

.level-pill {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 14px; margin-bottom: 14px;
}
.lv-badge {
  flex: 0 0 auto; font-size: 12px; font-weight: 700;
  background: var(--accent); color: #1A1206;
  padding: 5px 10px; border-radius: 99px; letter-spacing: .02em;
}
.levelup {
  margin-top: 6px; font-weight: 700; color: var(--accent);
  animation: pop .4s ease;
}

/* --- дневная цель: кольцо --- */

.home-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.ring-card {
  position: relative; flex: 0 0 auto;
  width: 74px; height: 74px;
  display: grid; place-items: center;
}
.ring circle { transition: stroke-dashoffset .6s ease; }
.ring-label {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; line-height: 1.1;
}
.ring-label b { font-size: 16px; }
.ring-label span { font-size: 9px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
.stats-mini { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats-mini .stat { padding: 10px 8px; }

/* --- путь уроков --- */

.path { position: relative; padding: 10px 0 4px; }
.path-node {
  position: relative; display: flex; flex-direction: column; align-items: center;
  margin: 0 auto 22px; width: 78px;
}
.path-node.l { margin-right: auto; margin-left: 8%; }
.path-node.r { margin-left: auto; margin-right: 8%; }
.path-node:not(:last-child)::after {
  content: ''; position: absolute; top: 100%; left: 50%; width: 2px; height: 26px;
  background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 12px);
  transform: translateX(-50%);
}
.node {
  width: 62px; height: 62px; border-radius: 50%;
  background: var(--card-2); border: 3px solid var(--line);
  display: grid; place-items: center; font-size: 20px; font-weight: 700;
  color: var(--ink-dim); box-shadow: 0 4px 0 var(--line);
}
.node.locked { opacity: .5; font-size: 18px; }
.node.done { background: var(--ok); border-color: var(--ok); color: #0C1A0B; box-shadow: 0 4px 0 #4d8a49; }
.node.current {
  background: var(--accent); border-color: var(--accent); color: #1A1206;
  box-shadow: 0 4px 0 var(--accent-2);
  animation: nodepulse 1.6s ease-in-out infinite;
}
@keyframes nodepulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
.node:active { transform: translateY(3px); box-shadow: none; }
.node-label {
  margin-top: 8px; font-size: 12px; font-weight: 600; text-align: center;
  color: var(--accent); max-width: 110px; line-height: 1.3;
}

/* --- сердца --- */

.hearts { display: flex; justify-content: center; gap: 4px; margin-bottom: 14px; font-size: 18px; }
.heart.lost { opacity: .35; filter: grayscale(1); }

/* --- комбо --- */

.combo {
  font-weight: 700; color: var(--accent);
  animation: pop .3s ease;
}

/* --- голосовой ввод --- */

.voice-box {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 22px; margin-bottom: 14px;
  border: 1.5px dashed var(--line); border-radius: 14px;
}
.voice-box.ok  { border-color: var(--ok);  border-style: solid; background: rgba(111,174,107,.09); }
.voice-box.bad { border-color: var(--bad); border-style: solid; background: rgba(210,96,79,.09); }
.mic-btn {
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--accent); color: #1A1206; font-size: 30px;
  display: grid; place-items: center; box-shadow: 0 4px 0 var(--accent-2);
}
.mic-btn.rec { background: var(--bad); box-shadow: 0 4px 0 #9c3d30; animation: nodepulse 1s ease-in-out infinite; }
.mic-btn:active { transform: translateY(3px); box-shadow: none; }
.voice-hint { font-size: 15px; color: var(--ink-dim); text-align: center; }

/* --- достижения --- */

.badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.badge {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 10px; text-align: center; opacity: .5;
}
.badge.on { opacity: 1; border-color: var(--accent); background: var(--card-2); }
.badge-icon { font-size: 30px; margin-bottom: 6px; }
.badge-title { font-weight: 650; font-size: 13.5px; margin-bottom: 3px; }
.badge-desc { font-size: 11.5px; color: var(--ink-faint); line-height: 1.35; }
.ach-unlock { margin-top: 6px; font-weight: 600; color: var(--accent); animation: pop .35s ease; }

/* --- конфетти --- */

.confetti-piece {
  position: fixed; top: -12px; width: 9px; height: 14px; z-index: 60;
  animation-name: confetti-fall; animation-timing-function: ease-in;
  animation-fill-mode: forwards; pointer-events: none; border-radius: 2px;
}
@keyframes confetti-fall {
  to { top: 106vh; transform: translateY(0) rotate(400deg); opacity: .9; }
}

</style>
</head>

<div id="app"></div>
<script>
/* ============================================================
   ПОЛИГЛОТ · Данные грамматического движка
   Метод Дмитрия Петрова: 3 времени × 3 формы = базовая таблица
   ============================================================ */

/* Местоимения-подлежащие. Порядок = индекс лица (0..5) */
const PRONOUNS = [
  { en: 'I',    ru: 'я',   third: false },
  { en: 'you',  ru: 'ты',  third: false },
  { en: 'he',   ru: 'он',  third: true  },
  { en: 'she',  ru: 'она', third: true  },
  { en: 'we',   ru: 'мы',  third: false },
  { en: 'they', ru: 'они', third: false }
];

/* Объектные местоимения (урок 2) */
const OBJ_PRONOUNS = [
  { en: 'me',   ru: 'меня' },
  { en: 'you',  ru: 'тебя' },
  { en: 'him',  ru: 'его'  },
  { en: 'her',  ru: 'её'   },
  { en: 'us',   ru: 'нас'  },
  { en: 'them', ru: 'их'   }
];

/* Притяжательные (урок 4) */
const POSSESSIVES = [
  { en: 'my',    ru: 'мой / моя / моё' },
  { en: 'your',  ru: 'твой / ваш' },
  { en: 'his',   ru: 'его' },
  { en: 'her',   ru: 'её' },
  { en: 'our',   ru: 'наш' },
  { en: 'their', ru: 'их' }
];

/*
  Глаголы.
  en   — базовая форма
  p2   — вторая форма (прошедшее утверждение). null = правильный глагол (+ed)
  p3   — третья форма (причастие, Perfect/пассив). null = как p2

<tr><th>Настоящее</th><td>I work<br><span class="dim">he work<b>s</b></span></td><td>I <b>don't</b> work<br><span class="dim">he <b>doesn't</b> work</span></td><td><b>do</b> I work?<br><span class="dim"><b>does</b> he work?</span></td></tr>
<tr><th>Прошедшее</th><td>I work<b>ed</b><br><span class="dim">2-я форма</span></td><td>I <b>didn't</b> work</td><td><b>did</b> I work?</td></tr>
<tr><th>Будущее</th><td>I <b>will</b> work</td><td>I <b>won't</b> work</td><td><b>will</b> I work?</td></tr>
</table></div>

<h3>Что нужно запомнить</h3>
<ul>
  <li>Порядок слов в утверждении жёсткий: <b>кто → что делает → остальное</b>.</li>
  <li>В вопросе вспомогательный глагол выходит вперёд: <b>do / did / will</b> + кто + глагол.</li>
  <li>После <b>do, does, did, will</b> глагол всегда стоит в <b>базовой форме</b>. Никаких -s и -ed.</li>
  <li><b>-s</b> появляется только в одной клетке: настоящее + утверждение + <i>he / she</i>.</li>
  <li>У неправильных глаголов «сломана» тоже только одна клетка: прошедшее + утверждение (<i>see → saw</i>).</li>
</ul>

<h3>Местоимения</h3>
<p>I — я, you — ты/вы, he — он, she — она, we — мы, they — они.</p>
<p class="note">Петров: слово <b>it</b> — это не «оно», а «это». Рода в английском нет.</p>

<h3>Правильные и неправильные</h3>
<p>Правильный глагол в прошедшем просто получает <b>-ed</b>: work → worked, love → loved.</p>
<p>Неправильный имеет свою вторую форму, и она нужна <b>только в одном месте из девяти</b>:</p>
<p class="mono">see (saw) · come (came) · go (went) · know (knew)</p>
<p>Во всех остальных клетках — обычная базовая форма: <i>I didn't see</i>, <i>did you see?</i>, <i>he will see</i>.</p>

<h3>Как тренироваться</h3>
<p>Берёте глагол и «прокручиваете» его по всем девяти клеткам. Занимает 20–30 секунд. Потом берёте следующий. Цель — довести до автоматизма, чтобы форма выскакивала без раздумий.</p>

  return w + 's';

  if (v.p2) return v.p2;
  return vEd(v.en);

  if (v.p3) return v.p3;
  if (v.p2) return v.p2;

  if (/e$/.test(w)) return w + 'd';
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'ied';

    const plural = (i === 4 || i === 5) && comp.ru_pl;

    if (f === 'neg') en = clean([p.en, "didn't", v.en, oEn]);
    if (f === 'que') { en = clean(['did', p.en, v.en, oEn]); q = true; }
    ru = clean([p.ru, f === 'neg' ? 'не' : '', ruPast(v, i, cfg.gender), oRu]);
  }

  if (t === 'fut') {
    if (f === 'aff') en = clean([p.en, 'will', v.en, oEn]);
    if (f === 'neg') en = clean([p.en, "won't", v.en, oEn]);
    if (f === 'que') { en = clean(['will', p.en, v.en, oEn]); q = true; }
    ru = clean([p.ru, f === 'neg' ? 'не' : '', RU_FUT[i], v.ru.inf, oRu]);
  }

  if (f === 'que') q = true;
  return finish(en, ru, q, `${TENSES.find(x=>x.id===t).ru} · ${FORMS.find(x=>x.id===f).ru}`);
}

function genToBe(cfg) {
  const i = Math.floor(Math.random() * 6);
  const p = PRONOUNS[i];
  const c = rnd(COMPS);
  const t = rnd(cfg.tenses);
  const f = rnd(cfg.forms);
  const beP = i === 0 ? 'am' : (p.third ? 'is' : 'are');
  const beD = (i === 0 || p.third) ? 'was' : 'were';
  const compRu = ruComp(c, i, cfg.gender, t);
  const compEn = enComp(c, i);

  let en, ru, q = false;

  if (t === 'pres') {
    if (f === 'aff') en = clean([p.en, beP, compEn]);
    if (f === 'neg') en = clean([p.en, beP, 'not', compEn]);
    if (f === 'que') { en = clean([beP, p.en, compEn]); q = true; }
    ru = clean([p.ru, f === 'neg' ? 'не' : '', compRu]);
  }
  if (t === 'past') {
    if (f === 'aff') en = clean([p.en, beD, compEn]);
    if (f === 'neg') en = clean([p.en, beD, 'not', compEn]);
    if (f === 'que') { en = clean([beD, p.en, compEn]); q = true; }
    ru = clean([p.ru, f === 'neg' ? 'не' : '', ruWas(i, cfg.gender), compRu]);
  }
  if (t === 'fut') {
    if (f === 'aff') en = clean([p.en, 'will be', compEn]);
    if (f === 'neg') en = clean([p.en, 'will not be', compEn]);
    if (f === 'que') { en = clean(['will', p.en, 'be', compEn]); q = true; }
    ru = clean([p.ru, f === 'neg' ? 'не' : '', RU_FUT[i], compRu]);
  }

  return finish(en, ru, q, 'глагол to be · состояние');
}

function genThere(cfg) {
  const n = rnd(THERE_NOUNS);
  const pl = rnd(THERE_PLACES);
  const t = rnd(cfg.tenses);
  const f = rnd(cfg.forms);
  const many = n.g === 'pl';

  let en, ru, q = false;

  if (t === 'pres') {
    const be = many ? 'are' : 'is';
    if (f === 'aff') en = clean(['there', be, n.en, pl.en]);
    if (f === 'neg') en = clean(['there', be, 'not', n.en, pl.en]);
    if (f === 'que') { en = clean([be, 'there', n.en, pl.en]); q = true; }
    ru = f === 'neg' ? clean([cap(pl.ru), 'нет', n.gen]) : clean([cap(pl.ru), 'есть', n.ru]);
  }
  if (t === 'past') {
    const be = many ? 'were' : 'was';
    if (f === 'aff') en = clean(['there', be, n.en, pl.en]);
    if (f === 'neg') en = clean(['there', be, 'not', n.en, pl.en]);
    if (f === 'que') { en = clean([be, 'there', n.en, pl.en]); q = true; }
    const wasRu = n.g === 'f' ? 'была' : n.g === 'n' ? 'было' : n.g === 'pl' ? 'были' : 'был';
    ru = f === 'neg' ? clean([cap(pl.ru), 'не было', n.gen]) : clean([cap(pl.ru), wasRu, n.ru]);
  }
  if (t === 'fut') {
    if (f === 'aff') en = clean(['there will be', n.en, pl.en]);
    if (f === 'neg') en = clean(['there will not be', n.en, pl.en]);
    if (f === 'que') { en = clean(['will there be', n.en, pl.en]); q = true; }
    ru = f === 'neg'
      ? clean([cap(pl.ru), 'не будет', n.gen])
      : clean([cap(pl.ru), many ? 'будут' : 'будет', n.ru]);
  }

  return finish(en, ru, q, 'there is / there are');
}

function genModal(cfg) {
  const pool = VERBS.filter(v => v.L <= cfg.maxL);
  const v = rnd(pool);
  const i = Math.floor(Math.random() * 6);
  const p = PRONOUNS[i];
  const m = rnd(MODALS);
  const f = rnd(cfg.forms);
  const obj = rnd(v.o);
  let en, ru, q = false;

  if (f === 'aff') en = clean([p.en, m.en, v.en, obj[0]]);
  if (f === 'neg') en = clean([p.en, m.neg, v.en, obj[0]]);
  if (f === 'que') { en = clean([m.en, p.en, v.en, obj[0]]); q = true; }

  if (m.isAdj) {
    const g = genderOf(i, cfg.gender);
    const w = m.ru[g] || m.ru.m;
    ru = clean([p.ru, f === 'neg' ? 'не' : '', w, v.ru.inf, obj[1]]);
  } else if (m.noPron) {
    ru = clean([m.dat[i], f === 'neg' ? 'не' : '', m.verb, v.ru.inf, obj[1]]);
  } else {
    ru = clean([p.ru, f === 'neg' ? 'не' : '', m.ru[i], v.ru.inf, obj[1]]);
  }

  return finish(en, ru, q, 'модальный глагол · без do и без -s');
}

function genCont(cfg) {
  const pool = VERBS.filter(v => v.L <= cfg.maxL && !['know','understand','want','have','remember','see'].includes(v.en));
  const v = rnd(pool);
  const i = Math.floor(Math.random() * 6);
  const p = PRONOUNS[i];
  const f = rnd(cfg.forms);
  const t = Math.random() < 0.5 ? 'pres' : 'past';
  const obj = rnd(v.o);
  const ving = vIng(v.en);
  const beP = i === 0 ? 'am' : (p.third ? 'is' : 'are');
  const beD = (i === 0 || p.third) ? 'was' : 'were';
  const be = t === 'pres' ? beP : beD;
  let en, ru, q = false;

  if (f === 'aff') en = clean([p.en, be, ving, obj[0]]);
  if (f === 'neg') en = clean([p.en, be, 'not', ving, obj[0]]);
  if (f === 'que') { en = clean([be, p.en, ving, obj[0]]); q = true; }

  const marker = t === 'pres' ? 'сейчас' : 'в тот момент';
  const verbRu = t === 'pres' ? v.ru.pres[i] : ruPast(v, i, cfg.gender);
  ru = clean([p.ru, marker, f === 'neg' ? 'не' : '', verbRu, obj[1]]);

  return finish(en, ru, q, 'Continuous · to be + -ing');
}

function genPerf(cfg) {
  const pool = VERBS.filter(v => v.L <= cfg.maxL);
  const v = rnd(pool);
  const i = Math.floor(Math.random() * 6);
  const p = PRONOUNS[i];
  const f = rnd(cfg.forms);
  const obj = rnd(v.o);
  const have = p.third ? 'has' : 'have';
  const haveN = p.third ? "hasn't" : "haven't";
  const pp = vPP(v);
  let en, ru, q = false;

  if (f === 'aff') { en = clean([p.en, have, 'already', pp, obj[0]]);
                     ru = clean([p.ru, 'уже', ruPast(v, i, cfg.gender), obj[1]]); }
  if (f === 'neg') { en = clean([p.en, haveN, pp, obj[0], 'yet']);
                     ru = clean([p.ru, 'ещё не', ruPast(v, i, cfg.gender), obj[1]]); }
  if (f === 'que') { en = clean([have, p.en, 'ever', pp, obj[0]]); q = true;
                     ru = clean([p.ru, 'когда-нибудь', ruPast(v, i, cfg.gender), obj[1]]); }

  return finish(en, ru, q, 'Present Perfect · have + 3-я форма');
}

function genPairs(list, hint) {
  const pair = rnd(list);
  return {
    en: pair[0],
    ru: pair[1],
    hint,
    tokens: makeTokens(pair[0])
  };
}

/* ---------- сборка результата ---------- */

function finish(en, ru, q, hint) {
  const enFinal = cap(en) + (q ? '?' : '.');
  const ruFinal = cap(ru) + (q ? '?' : '.');
  return { en: enFinal, ru: ruFinal, hint, tokens: makeTokens(enFinal) };
}

/* Плитки: правильные слова + отвлекающие, всё перемешано */
function makeTokens(sentence) {
  const words = sentence.replace(/[.?!]/g, '').split(' ').filter(Boolean);
  const extra = [];
  const bag = DISTRACTORS.filter(d => !words.some(w => w.toLowerCase() === d));
  const need = Math.min(4, Math.max(2, Math.round(words.length / 2)));
  while (extra.length < need && bag.length) {
    const d = bag.splice(Math.floor(Math.random() * bag.length), 1)[0];
    extra.push(d);
  }
  const all = words.concat(extra);
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all;
}

/* ---------- публичная точка входа ---------- */

function generatePhrase(drill, gender) {
  const cfg = {
    tenses: drill.tenses,
    forms: drill.forms,
    maxL: drill.maxL,
    gender: gender || 'm'
  };
  const mode = rnd(drill.modes);
  switch (mode) {
    case 'tobe':  return genToBe(cfg);
    case 'there': return genThere(cfg);
    case 'modal': return genModal(cfg);
    case 'cont':  return genCont(cfg);
    case 'perf':  return genPerf(cfg);
    case 'imper': return genPairs(IMPERATIVES, 'повелительное наклонение');
    case 'pass':  return genPairs(PASSIVES, 'пассивный залог · to be + 3-я форма');
    default:      return genBase(cfg);
  }
}

/* ---------------- состояние ---------------- */

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function addDays(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function newProfile(name, gender) {
  return {
    name, gender,
    unlocked: 1, xp: 0, streak: 0, lastDay: null,
    doneToday: 0, newToday: 0, dayStamp: today(),
    goal: 20, typeMode: false, voiceMode: false, soundOn: true,

    cards: {}, lessons: {}
  };
}

/* заполняет недостающие поля у профилей, сохранённых старой версией */
function ensureProfileDefaults(p) {
  if (p.voiceMode === undefined) p.voiceMode = false;
  if (p.soundOn === undefined) p.soundOn = true;
  if (p.hearts === undefined) p.hearts = 5;
  if (p.heartsDay === undefined) p.heartsDay = today();
  if (p.maxCombo === undefined) p.maxCombo = 0;
  if (p.seenAch === undefined) p.seenAch = [];
}

/* ---------------- уровни / лига по опыту ---------------- */

const LEVELS = [
  { name: 'Новичок',     min: 0    },
  { name: 'Ученик',      min: 100  },
  { name: 'Способный',   min: 250  },
  { name: 'Уверенный',   min: 500  },
  { name: 'Продвинутый', min: 900  },
  { name: 'Знаток',      min: 1500 },
  { name: 'Мастер',      min: 2500 },
  { name: 'Полиглот',    min: 4000 }
];

function levelInfo(xp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].min) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1];
  const span = next ? next.min - cur.min : 1;
  const into = xp - cur.min;
  const pct = next ? Math.min(100, Math.round(into / span * 100)) : 100;
  return { level: idx + 1, name: cur.name, next: next ? next.name : null, pct, into, span, max: !next };
}

let pendingLevelUp = null;

/* ---------------- достижения ---------------- */

function countLearnedWords(p) {
  return Object.values(p.cards).filter(c => c.iv >= 7).length;

function countTouchedWords(p) {

}
function allWordsTotal() {
  return COURSE.reduce((n, L) => n + L.vocab.length, 0);
}
function anyPerfectExam(p) {
  return Object.values(p.lessons).some(st => st.best === 100);

function courseComplete(p) {

function computeAchievements(p) {

}

/* возвращает только что разблокированные (и отмечает их увиденными) */
function checkNewAchievements(p) {
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    if (a.test(p) && !p.seenAch.includes(a.id)) {
      p.seenAch.push(a.id);
      fresh.push(a);
    }
  }
  if (fresh.length) save();
  return fresh;
}

/* ---------------- звук ---------------- */

let actx = null;
function tone(freq, dur, type, delay, vol) {
  const p = P();
  if (!p || !p.soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    const t0 = actx.currentTime + (delay || 0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) { /* Web Audio недоступен — тихо игнорируем */ }
}
const sfxCorrect  = () => { tone(880, .10, 'sine', 0, .14); tone(1318, .14, 'sine', .06, .12); };

function confetti(n) {

  const frag = document.createDocumentFragment();
  for (let i = 0; i < (n || 26); i++) {

    el.style.left = Math.random() * 100 + 'vw';

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* приватный режим Safari */ }
  return { active: null, profiles: {} };
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { /* нет доступа к хранилищу — работаем в памяти */ }
}

let S = load();
const P = () => S.profiles[S.active];

function rollDay() {
  const p = P(); if (!p) return;
  ensureProfileDefaults(p);
  const t = today();
  if (p.dayStamp !== t) {
    if (p.lastDay && daysBetween(p.lastDay, t) === 1) { /* серия продолжается */ }
    else if (p.lastDay && daysBetween(p.lastDay, t) > 1) { p.streak = 0; }
    p.dayStamp = t; p.doneToday = 0; p.newToday = 0;
    save();
  }
  if (p.heartsDay !== t) { p.hearts = 5; p.heartsDay = t; save(); }
}

function credit(n) {
  const p = P();
  const t = today();
  const beforeLevel = levelInfo(p.xp).level;
  p.xp += n;
  p.doneToday += 1;
  if (p.lastDay !== t) {
    p.streak = (p.lastDay && daysBetween(p.lastDay, t) === 1) ? p.streak + 1 : 1;
    p.lastDay = t;
  }
  const afterLevel = levelInfo(p.xp).level;
  if (afterLevel > beforeLevel) pendingLevelUp = levelInfo(p.xp).name;
  save();
}

/* ---------------- озвучка ---------------- */

let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[.?!]/g, ''));
  u.lang = 'en-US';
  u.rate = 0.9;
  const v = voices.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Alex|Ava|Google US/i.test(v.name))
         || voices.find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------------- SRS ---------------- */

function cardKey(lesson, en) { return lesson + '|' + en; }

function dueCards() {
  const p = P();
  const t = today();
  const due = [], fresh = [];
  for (let n = 1; n <= p.unlocked; n++) {
    const L = COURSE[n - 1];
    for (const [en, ru] of L.vocab) {
      const k = cardKey(n, en);
      const c = p.cards[k];
      if (!c) fresh.push({ k, en, ru, lesson: n });
      else if (c.due <= t) due.push({ k, en, ru, lesson: n, c });
    }
  }
  const room = Math.max(0, NEW_CARDS_PER_DAY - p.newToday);
  return due.concat(fresh.slice(0, room));
}

function gradeCard(k, g) {
  const p = P();
  let c = p.cards[k];
  const isNew = !c;
  if (!c) c = { ef: 2.5, iv: 0, n: 0, due: today() };
  if (g === 0) { c.n = 0; c.iv = 0; c.ef = Math.max(1.3, c.ef - 0.25); c.due = today(); }
  else {
    c.n += 1;
    if (g === 1) { c.ef = Math.max(1.3, c.ef - 0.15); c.iv = c.n === 1 ? 1 : Math.max(1, Math.round(c.iv * 1.2)); }
    else { c.ef = Math.min(3.0, c.ef + 0.1); c.iv = c.n === 1 ? 1 : c.n === 2 ? 3 : Math.round(c.iv * c.ef); }
    c.due = addDays(c.iv);
  }
  p.cards[k] = c;
  if (isNew) p.newToday += 1;
  save();
}

/* --- кольцо дневной цели (SVG) --- */

function ringSVG(pct, size, stroke) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, pct / 100));
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pct >= 100 ? 'var(--ok)' : 'var(--accent)'}"
      stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

/* --- тренажёр --- */

function startDrill(lesson, kind) {
  const p = P();
  if (kind === 'exam' && p.hearts <= 0) return;
  const L = COURSE[lesson - 1];
  const drill = kind === 'warmup'
    ? { ...L.drill, maxL: p.unlocked }
    : L.drill;
  session = {
    lesson, kind, drill,
    total: kind === 'exam' ? EXAM_LEN : DRILL_LEN,
    i: 0, correct: 0, combo: 0, maxCombo: 0, heartsOut: false,
    phrase: null, picked: [], checked: false, wasRight: false
  };
  nextPhrase();
  go('drill');
}

function nextPhrase() {
  session.phrase = generatePhrase(session.drill, P().gender);
  session.picked = [];
  session.checked = false;
}

function speechSupported() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function startRecognition(s) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || s.checked) return;
  try {
    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    s.recording = true; renderDrill();
    rec.onresult = e => {
      const text = (e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript) || '';
      s.picked = text.trim().split(/\s+/).filter(Boolean);
      s.recording = false;
      if (session === s) renderDrill();
    };
    rec.onerror = () => { s.recording = false; if (session === s) renderDrill(); };
    rec.onend = () => { s.recording = false; };
    rec.start();
  } catch (e) { s.recording = false; }
}

function renderDrill() {
  const s = session;
  if (!s) return go('home');

  if (s.i >= s.total) return renderDrillEnd();

  const p = P();
  const pct = Math.round(s.i / s.total * 100);
  const answerText = s.picked.join(' ');
  const useVoice = p.voiceMode && speechSupported();

  app.innerHTML = topbar(
      s.kind === 'exam' ? 'Экзамен' : s.kind === 'warmup' ? 'Разминка' : 'Тренажёр',
      'Урок ' + s.lesson) + `
    <div class="drill-top">
      <span>${s.i + 1} / ${s.total}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${s.combo >= 2 ? `<span class="combo">🔥${s.combo}</span>` : `<span>${s.correct} ✓</span>`}
    </div>
    ${s.kind === 'exam' ? `<div class="hearts">${Array.from({length:5}).map((_,i)=>`<span class="heart ${i < p.hearts ? '' : 'lost'}">${i < p.hearts ? '❤️' : '🖤'}</span>`).join('')}</div>` : ''}

    <div class="prompt">
      ${s.kind === 'exam' ? '' : `<div class="hint">${esc(s.phrase.hint)}</div>`}
      <div class="ru">${esc(s.phrase.ru)}</div>
    </div>

    ${useVoice ? `
      <div class="voice-box ${s.checked ? (s.wasRight ? 'ok' : 'bad') : ''}">
        <button class="mic-btn ${s.recording ? 'rec' : ''}" id="mic" ${s.checked ? 'disabled' : ''}>${s.recording ? '●' : '🎤'}</button>
        <div class="voice-hint">${answerText ? esc(answerText) : 'нажми и произнеси фразу по-английски'}</div>
      </div>
    ` : p.typeMode ? `
      <input class="typed" id="typed" autocapitalize="off" autocorrect="off" autocomplete="off"
             spellcheck="false" placeholder="Ответ по-английски" value="${esc(answerText)}" ${s.checked ? 'disabled' : ''}>
    ` : `
      <div class="answer ${s.checked ? (s.wasRight ? 'ok' : 'bad') : ''}" id="answer">
        ${s.picked.map((w, idx) => `<button class="tile" data-un="${idx}">${esc(w)}</button>`).join('')}
      </div>
      <div class="tiles">
        ${s.phrase.tokens.map((w, idx) => `<button class="tile ${s.picked.includes(w) && countIn(s.picked, w) > countUpTo(s.phrase.tokens, w, idx) ? 'used' : ''}" data-tk="${idx}">${esc(w)}</button>`).join('')}
      </div>
    `}

    ${s.checked ? `
      <div class="feedback ${s.wasRight ? 'ok' : 'bad'}">
        <div class="label">${s.wasRight ? 'Верно' : 'Правильный ответ'}</div>
        <div class="correct">${esc(s.phrase.en)}</div>
      </div>
      <div class="btn-row">
        <button class="speak" id="say" style="width:52px;min-height:52px">🔊</button>
        <button class="btn primary" id="next">Дальше</button>
      </div>
    ` : `
      <div class="btn-row">
        <button class="btn ghost" id="skip">Не знаю</button>
        <button class="btn primary" id="check">Проверить</button>
      </div>
    `}
    <button class="btn ghost" id="quit" style="margin-top:8px">Закончить</button>`;

  document.getElementById('back').onclick = () => { session = null; go('lesson', { lesson: s.lesson }); };
  document.getElementById('quit').onclick = () => { session = null; go('lesson', { lesson: s.lesson }); };

  if (useVoice) {
    const mic = document.getElementById('mic');
    if (mic) mic.onclick = () => startRecognition(s);
  } else if (!p.typeMode) {
    app.querySelectorAll('[data-tk]').forEach(b => b.onclick = () => {
      if (s.checked) return;
      s.picked.push(s.phrase.tokens[+b.dataset.tk]);
      renderDrill();
    });
    app.querySelectorAll('[data-un]').forEach(b => b.onclick = () => {
      if (s.checked) return;
      s.picked.splice(+b.dataset.un, 1);
      renderDrill();
    });
  }

  const chk = document.getElementById('check');
  if (chk) chk.onclick = () => {
    if (p.typeMode && !useVoice) s.picked = (document.getElementById('typed').value || '').trim().split(/\s+/).filter(Boolean);
    checkAnswer();
  };

  const skip = document.getElementById('skip');
  if (skip) skip.onclick = () => { s.picked = []; applyResult(false); };

  const nx = document.getElementById('next');
  if (nx) nx.onclick = () => {
    if (s.heartsOut) { s.i = s.total; } else { s.i += 1; nextPhrase(); }
    renderDrill();
  };

  const say = document.getElementById('say');
  if (say) say.onclick = () => speak(s.phrase.en);

  const ti = document.getElementById('typed');
  if (ti && !s.checked) {
    ti.oninput = () => { s.picked = ti.value.trim().split(/\s+/).filter(Boolean); };
    ti.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); } };
  }
}

function countIn(arr, w) { return arr.filter(x => x === w).length; }
function countUpTo(arr, w, idx) { return arr.slice(0, idx + 1).filter(x => x === w).length - 1; }

function checkAnswer() {
  const s = session;
  const ok = norm(s.picked.join(' ')) === norm(s.phrase.en);
  applyResult(ok);
}

function applyResult(ok) {
  const s = session;
  const p = P();
  s.checked = true;
  s.wasRight = ok;
  if (ok) {
    s.combo += 1;
    s.maxCombo = Math.max(s.maxCombo, s.combo);
    sfxCorrect();
    s.correct += 1; credit(1);
  } else {
    s.combo = 0;
    sfxWrong();
    if (s.kind === 'exam') {
      p.hearts = Math.max(0, p.hearts - 1);
      sfxHeart();
      save();
      if (p.hearts === 0) s.heartsOut = true;
    }
  }
  speak(s.phrase.en);
  renderDrill();
}

function renderDrillEnd() {
  const s = session;
  const p = P();
  const pct = Math.round(s.correct / s.total * 100);
  const st = p.lessons[s.lesson] || (p.lessons[s.lesson] = {});

  let unlockedNow = false;
  if (s.kind === 'exam') {
    st.best = Math.max(st.best || 0, pct);
    if (pct >= EXAM_PASS * 100 && p.unlocked === s.lesson && s.lesson < 16) {
      p.unlocked = s.lesson + 1;
      unlockedNow = true;
    }
  } else {
    st.drills = (st.drills || 0) + 1;
  }
  p.maxCombo = Math.max(p.maxCombo, s.maxCombo);
  const beforeLevel = levelInfo(p.xp).level;
  p.xp += Math.round(pct / 10);
  const afterLevel = levelInfo(p.xp).level;
  const leveledUp = afterLevel > beforeLevel ? levelInfo(p.xp).name : null;
  save();

  const newAch = checkNewAchievements(p);
  const failed = s.kind === 'exam' && pct < EXAM_PASS * 100;
  const mood = s.heartsOut ? 'sad' : (pct === 100 ? 'excited' : (failed ? 'sad' : 'happy'));

  if (pct === 100 || unlockedNow || leveledUp) confetti(unlockedNow || leveledUp ? 34 : 24);
  if (unlockedNow || pct === 100) sfxComplete();
  if (leveledUp) setTimeout(sfxLevelUp, 260);

  app.innerHTML = topbar('Готово', 'Урок ' + s.lesson) + `
    <div class="flash">
      <div class="mascot-wrap" style="margin:0 auto 6px">${mascotSVG(mood, 72)}</div>
      <div class="word" style="font-size:46px">${pct}%</div>
      <div class="tr">${s.correct} из ${s.total}</div>
      ${s.maxCombo >= 3 ? `<div style="color:var(--accent);font-weight:600">🔥 лучшая серия: ${s.maxCombo}</div>` : ''}
      ${s.heartsOut ? '<div style="color:var(--bad);font-weight:600">Сердца закончились — попробуйте завтра или потренируйтесь без экзамена</div>' : ''}
      ${unlockedNow ? '<div style="color:var(--ok);font-weight:600">Урок ' + (s.lesson + 1) + ' открыт</div>' : ''}
      ${failed && !s.heartsOut ? '<div style="color:var(--ink-dim);font-size:14px">Нужно ' + Math.round(EXAM_PASS * 100) + '%. Погоняйте тренажёр и попробуйте снова.</div>' : ''}
      ${leveledUp ? `<div class="levelup">⭐ Новый уровень: ${esc(leveledUp)}</div>` : ''}
      ${newAch.map(a => `<div class="ach-unlock">${a.icon} Ачивка: ${esc(a.title)}</div>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn" id="again" ${s.kind === 'exam' && p.hearts <= 0 ? 'disabled' : ''}>Ещё подход</button>
      <button class="btn primary" id="home">На главную</button>
    </div>`;

  document.getElementById('back').onclick = () => { session = null; go('home'); };
  document.getElementById('home').onclick = () => { session = null; go('home'); };
  const again = document.getElementById('again');
  if (again) again.onclick = () => startDrill(s.lesson, s.kind);
}

  app.innerHTML = topbar('Слова', 'осталось ' + cardQueue.length) + `
    <div class="flash" id="flash">
      <div class="word">${esc(c.en)}</div>
      ${cardShown ? `<div class="tr">${esc(c.ru)}</div>` : '<div class="tap">нажмите, чтобы увидеть перевод</div>'}
    </div>
    ${cardShown ? `
      <div class="grade">
        <button class="btn" data-g="0">Не помню</button>
        <button class="btn" data-g="1">Трудно</button>
        <button class="btn primary" data-g="2">Легко</button>
      </div>` : `
      <button class="btn primary" id="show">Показать перевод</button>`}
    <button class="btn ghost" id="sayw" style="margin-top:10px">🔊 Произнести</button>`;

  document.getElementById('back').onclick = () => { cardQueue = null; cardShown = false; go('home'); };
  document.getElementById('sayw').onclick = () => speak(clean);
  document.getElementById('flash').onclick = () => { cardShown = true; speak(clean); renderCards(); };
  const sh = document.getElementById('show');
  if (sh) sh.onclick = () => { cardShown = true; speak(clean); renderCards(); };

  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = +b.dataset.g;
    if (g === 2) sfxCorrect(); else if (g === 0) sfxWrong();
    gradeCard(c.k, g);
    credit(1);
    cardQueue.shift();
    if (g === 0) cardQueue.push(c);
    cardShown = false;
    renderCards();
  });
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* --- статистика и настройки --- */

function renderStats() {
  const p = P();
  const totalCards = Object.keys(p.cards).length;
  const learned = Object.values(p.cards).filter(c => c.iv >= 7).length;
  const allWords = COURSE.reduce((n, L) => n + L.vocab.length, 0);
  const lv = levelInfo(p.xp);
  const ach = computeAchievements(p);
  const gotAch = ach.filter(a => a.unlocked).length;
  const voiceOk = speechSupported();

  app.innerHTML = topbar('Статистика', esc(p.name)) + `
    <div class="level-pill" style="margin-bottom:14px">
      <span class="lv-badge">Ур. ${lv.level}</span>
      <div class="grow"><b style="font-size:14px">${esc(lv.name)}</b></div>
    </div>

    <div class="stats">
      <div class="stat hot"><div class="v">${p.streak}</div><div class="k">дней подряд</div></div>
      <div class="stat"><div class="v">${p.xp}</div><div class="k">очков</div></div>
      <div class="stat"><div class="v">${p.unlocked}/16</div><div class="k">уроков</div></div>
    </div>

    <button class="card" id="toAch" style="width:100%;text-align:left;cursor:pointer">
      <div class="row"><div class="grow"><b>🏅 Достижения</b></div><div style="color:var(--ink-faint)">${gotAch}/${ach.length} ›</div></div>
    </button>

    <div class="card">
      <div class="row"><div class="grow">Слов в работе</div><b>${totalCards} / ${allWords}</b></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Закреплено (интервал ≥ 7 дней)</div><b>${learned}</b></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Дневная цель</div>
        <button class="btn sm" id="goalMinus">−</button>
        <b style="min-width:34px;text-align:center">${p.goal}</b>
        <button class="btn sm" id="goalPlus">+</button>
      </div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Вводить ответ с клавиатуры</div>
        <button class="btn sm" id="tm">${p.typeMode ? 'вкл' : 'выкл'}</button>
      </div>
      <p style="margin:8px 0 0;font-size:13px;color:var(--ink-faint)">Выключено — собираете фразу из плиток. Включено — печатаете сами, это сложнее и полезнее.</p>
    </div>
    ${voiceOk ? `
    <div class="card">
      <div class="row"><div class="grow">Отвечать голосом</div>
        <button class="btn sm" id="vm">${p.voiceMode ? 'вкл' : 'выкл'}</button>
      </div>
      <p style="margin:8px 0 0;font-size:13px;color:var(--ink-faint)">Произносишь фразу вслух вместо набора текста — как в ELSA Speak.</p>
    </div>` : ''}
    <div class="card">
      <div class="row"><div class="grow">Звуковые эффекты</div>
        <button class="btn sm" id="snd">${p.soundOn ? 'вкл' : 'выкл'}</button>
      </div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Род для фраз о себе</div>
        <button class="btn sm" id="gd">${p.gender === 'f' ? 'женский' : 'мужской'}</button>
      </div>
      <p style="margin:8px 0 0;font-size:13px;color:var(--ink-faint)">Влияет на русские подсказки: «я делал» / «я делала».</p>
    </div>

    <button class="btn ghost" id="switchP" style="margin-top:14px">Сменить человека</button>
    <button class="btn ghost" id="reset" style="margin-top:8px;color:var(--bad)">Сбросить прогресс</button>`;

  document.getElementById('back').onclick = () => go('home');
  document.getElementById('toAch').onclick = () => go('achievements');
  document.getElementById('goalMinus').onclick = () => { p.goal = Math.max(5, p.goal - 5); save(); render(); };
  document.getElementById('goalPlus').onclick = () => { p.goal = Math.min(100, p.goal + 5); save(); render(); };
  document.getElementById('tm').onclick = () => { p.typeMode = !p.typeMode; save(); render(); };
  const vm = document.getElementById('vm');
  if (vm) vm.onclick = () => { p.voiceMode = !p.voiceMode; save(); render(); };
  document.getElementById('snd').onclick = () => { p.soundOn = !p.soundOn; save(); render(); if (p.soundOn) sfxCorrect(); };
  document.getElementById('gd').onclick = () => { p.gender = p.gender === 'f' ? 'm' : 'f'; save(); render(); };
  document.getElementById('switchP').onclick = () => { S.active = null; save(); render(); };
  document.getElementById('reset').onclick = () => {
    if (!confirm('Сбросить весь прогресс ' + p.name + '?')) return;
    S.profiles[S.active] = newProfile(p.name, p.gender);
    save(); go('home');
  };
}

/* --- достижения --- */

function renderAchievements() {
  const p = P();
  const ach = computeAchievements(p);

  app.innerHTML = topbar('Достижения', esc(p.name)) + `
    <div class="badge-grid">
      ${ach.map(a => `
        <div class="badge ${a.unlocked ? 'on' : ''}">
          <div class="badge-icon">${a.unlocked ? a.icon : '🔒'}</div>
          <div class="badge-title">${esc(a.title)}</div>
          <div class="badge-desc">${esc(a.desc)}</div>
        </div>`).join('')}
    </div>
    <p class="footnote">Открывай новые достижения, занимаясь регулярно — за это и держится метод Петрова.</p>`;

  document.getElementById('back').onclick = () => go('stats');
}

/* ---------------- отладочный доступ (для автотестов) ---------------- */

window.Poliglot = {
  get S() { return S; },
  get session() { return session; },
  get route() { return R; },
  levelInfo, computeAchievements
};

/* ---------------- старт ---------------- */

(function init() {
  if (!Object.keys(S.profiles).length) {
    S.profiles.azamat = newProfile('Азамат', 'm');
    S.profiles.wife = newProfile('Жена', 'f');
    save();
  }
  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

</script>
